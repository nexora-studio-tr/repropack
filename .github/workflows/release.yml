name: Publish source release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Check tag matches package
        run: node -e "if(process.env.GITHUB_REF_NAME!=='v'+JSON.parse(require('fs').readFileSync('package.json')).version)process.exit(1)"
      - run: npm run release:check
      - run: npm run release:package
      - name: Publish the verified alpha archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "Release already exists; preserving its uploaded assets and notes."
          else
            gh release create "$GITHUB_REF_NAME" artifacts/release/*.tgz artifacts/release/*.sha256 --verify-tag --prerelease --title "ReproPack $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
          fi
