name: repropack
services:
  app:
    build: .
    image: repropack:0.6.0-alpha.1
    labels:
      io.repropack.deployment-owner: ${REPROPACK_DEPLOYMENT_OWNER:-operator}
    init: true
    ports:
      - "127.0.0.1:${REPROPACK_HTTP_PORT:-4317}:4317"
    environment:
      REPROPACK_DATA_DIR: ${REPROPACK_CONTAINER_DATA_DIR:-/var/lib/repropack}
      REPROPACK_PUBLIC_ORIGIN: ${REPROPACK_PUBLIC_ORIGIN:-}
      REPROPACK_SMTP_HOST: ${REPROPACK_SMTP_HOST:-}
      REPROPACK_SMTP_PORT: ${REPROPACK_SMTP_PORT:-}
      REPROPACK_SMTP_SECURE: ${REPROPACK_SMTP_SECURE:-}
      REPROPACK_SMTP_USER: ${REPROPACK_SMTP_USER:-}
      REPROPACK_SMTP_PASSWORD: ${REPROPACK_SMTP_PASSWORD:-}
      REPROPACK_MAIL_FROM: ${REPROPACK_MAIL_FROM:-}
      REPROPACK_REQUIRE_VERIFIED_EMAIL: ${REPROPACK_REQUIRE_VERIFIED_EMAIL:-0}
    volumes:
      - data:/var/lib/repropack
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777,nosuid,nodev,noexec
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
    restart: unless-stopped
volumes:
  data:
    labels:
      io.repropack.deployment-owner: ${REPROPACK_DEPLOYMENT_OWNER:-operator}
